<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>para vos mauro</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;600;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #F7F6E5;
            --accent-red: #DA4848;
            --accent-blue: #76D2DB;
            --dark-purple: #36064D;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-color);
            color: var(--dark-purple);
            font-family: 'Montserrat', sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            color: var(--accent-red);
            text-shadow: 2px 2px 0px var(--accent-blue);
            margin: 10px 0;
            text-align: center;
        }

        /* SECCIÓN DEL VINILO */
        .player-section {
            text-align: center;
            margin-bottom: 30px;
            display: none; /* Se oculta hasta que se toca una canción */
            animation: fadeIn 0.8s ease;
        }
        .player-section.active { display: block; }

        .vinyl-container {
            width: 220px; height: 220px;
            background: repeating-radial-gradient(#222, #000 5px);
            border-radius: 50%;
            margin: 0 auto 15px;
            border: 8px solid var(--dark-purple);
            display: flex; align-items: center; justify-content: center;
            animation: spin 4s linear infinite;
            animation-play-state: paused;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .vinyl-container.playing { animation-play-state: running; }
        
        .vinyl-label {
            width: 80px; height: 80px;
            background-color: var(--accent-red);
            border-radius: 50%; border: 4px solid white;
            /* Aquí puedes poner una foto pequeña vuestra si quieres */
            background-image: url('https://images.unsplash.com/photo-1516280440614-37939bbacd81?w=200');
            background-size: cover;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        #now-playing {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: var(--accent-red);
            margin-bottom: 10px;
        }

        /* LISTA DE CANCIONES */
        .playlist-container { width: 100%; max-width: 500px; }
        .song-item {
            background: white;
            border: 2px solid var(--dark-purple);
            margin-bottom: 10px;
            padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer;
            font-family: 'Dancing Script', cursive;
            font-size: 1.5rem;
            transition: 0.3s;
        }
        .song-item:hover { background: var(--accent-blue); transform: scale(1.02); }
        .song-item.active-song { border-color: var(--accent-red); background: #fff5f5; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .btn-pause {
            background: var(--dark-purple); color: white;
            border: none; padding: 10px 20px; border-radius: 20px;
            font-weight: 900; cursor: pointer; margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <audio id="main-audio"></audio>

    <h1>Para un apasionado de la música...</h1>

    <div id="player-ui" class="player-section">
        <div id="now-playing">Sonando ahora...</div>
        <div id="vinyl" class="vinyl-container">
            <div class="vinyl-label"></div>
        </div>
        <button class="btn-pause" onclick="togglePlay()" id="play-btn">PAUSAR</button>
    </div>

    <div class="playlist-container">
        <div id="song-list">
            </div>
    </div>

    <script>
        // CONFIGURACIÓN DE CANCIONES
        // He puesto tu link de Drive ya convertido en la primera. 
        // Para las demás, solo cambia el ID_AQUÍ.
        const songs = [
            { name: "1. La mirada - Bhavi & LOUTA", url: "https://docs.google.com/uc?export=download&id=1xPsnxfUMhtUfiWNkl4H8qG2e7yDQP2F1" },
            { name: "2. Can't take my eyes off you - Morten Harket", url: "https://docs.google.com/uc?export=download&id=1NX7AVRtJocRFyiKYzCxPZRgVaz6LvZeR" },
            { name: "3. Like i'm gonna lose you - Meghan Trainor & John Legend", url: "https://docs.google.com/uc?export=download&id=1oDwoedof54pgQZksOw3OZhN5WOIXno-O" },
            { name: "4. Love, Maybe - Secret Number", url: "https://docs.google.com/uc?export=download&id=1au9c6erbKf5bUJyjVAJGRN2L0S2FXeKC" },
            { name: "5. Cuando tus ojos me ven - Uni", url: "https://docs.google.com/uc?export=download&id=1rsMuc1ECNGBG3geHrsstsRbs7QptI--9" },
            { name: "6. Bonsai - Alan Sutton", url: "https://docs.google.com/uc?export=download&id=15ZxMU8-DV-6nNr_XY2kkHu5xZIRENQrl" },
            { name: "7. One Of The Girls - The Weeknd, JENNIE & Lily Rose Depp", url: "https://docs.google.com/uc?export=download&id=1SNVsHG9wJOVjFuhIWuMwR-6izep5Z7oH" },
            { name: "8. Everybody loves somebody - Dean Martin", url: "https://docs.google.com/uc?export=download&id=1y8bz9lPxE_f4YsR7iHgOt8emAprdLvaM" },
            { name: "9. Loco Lindo - PALO", url: "https://docs.google.com/uc?export=download&id=1Whcmis1FzDKO3ajveGCbC2F1mqv4HmLQ" },
            { name: "10. Hacela corto morocho - PALO", url: "https://docs.google.com/uc?export=download&id=1hpc0CvqmOqUril6WkfoGMYnNiGYipqSP" }
        ];

        let currentIndex = -1;
        const audio = document.getElementById('main-audio');
        const vinyl = document.getElementById('vinyl');
        const playerUI = document.getElementById('player-ui');
        const listDiv = document.getElementById('song-list');

        // Generar lista
        songs.forEach((song, index) => {
            const div = document.createElement('div');
            div.className = 'song-item';
            div.id = `song-${index}`;
            div.innerHTML = `<span>${song.name}</span> <span>▶</span>`;
            div.onclick = () => playSong(index);
            listDiv.appendChild(div);
        });

        function playSong(index) {
            if (currentIndex === index && !audio.paused) {
                togglePlay();
                return;
            }

            currentIndex = index;
            const song = songs[currentIndex];
            
            // UI
            playerUI.classList.add('active');
            document.getElementById('now-playing').innerText = "Sonando: " + song.name;
            document.querySelectorAll('.song-item').forEach(el => el.classList.remove('active-song'));
            document.getElementById(`song-${index}`).classList.add('active-song');

            // Audio
            audio.src = song.url;
            audio.play();
            vinyl.classList.add('playing');
            document.getElementById('play-btn').innerText = "PAUSAR";
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                vinyl.classList.add('playing');
                document.getElementById('play-btn').innerText = "PAUSAR";
            } else {
                audio.pause();
                vinyl.classList.remove('playing');
                document.getElementById('play-btn').innerText = "REPRODUCIR";
            }
        }

        // AUTO-PLAY: Al terminar, salta a la siguiente
        audio.onended = function() {
            if (currentIndex + 1 < songs.length) {
                playSong(currentIndex + 1);
            } else {
                vinyl.classList.remove('playing');
                document.getElementById('now-playing').innerText = "¡Playlist terminada!";
            }
        };
    </script>
</body>
</html>
